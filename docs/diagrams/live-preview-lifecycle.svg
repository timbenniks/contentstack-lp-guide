<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Live Preview session lifecycle">
  <defs>
    <style>
      .title { font: 600 20px/1.2 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .label { font: 600 14px/1.2 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .text  { font: 12.5px/1.3 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .muted { fill: #6b7280; }
      .box   { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 10; }
      .line  { stroke: #111827; stroke-width: 2; }
      .dot   { fill: #111827; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#ffffff" />
  <text x="40" y="36" class="title">Live Preview Session Lifecycle</text>

  <!-- Timeline -->
  <line x1="80" y1="120" x2="880" y2="120" class="line" />

  <circle cx="120" cy="120" r="6" class="dot" />
  <circle cx="280" cy="120" r="6" class="dot" />
  <circle cx="440" cy="120" r="6" class="dot" />
  <circle cx="600" cy="120" r="6" class="dot" />
  <circle cx="760" cy="120" r="6" class="dot" />

  <text x="120" y="95" text-anchor="middle" class="label">1. Create</text>
  <text x="280" y="95" text-anchor="middle" class="label">2. Load</text>
  <text x="440" y="95" text-anchor="middle" class="label">3. Handshake</text>
  <text x="600" y="95" text-anchor="middle" class="label">4. Steady</text>
  <text x="760" y="95" text-anchor="middle" class="label">5. End</text>

  <rect x="70" y="160" width="200" height="80" class="box" />
  <text x="90" y="185" class="text">CMS creates session</text>
  <text x="90" y="205" class="text">Hash generated</text>

  <rect x="230" y="160" width="200" height="80" class="box" />
  <text x="250" y="185" class="text">Site loads with</text>
  <text x="250" y="205" class="text">hash + params</text>

  <rect x="390" y="160" width="200" height="80" class="box" />
  <text x="410" y="185" class="text">SDK init</text>
  <text x="410" y="205" class="text">init / init-ack</text>

  <rect x="550" y="160" width="200" height="80" class="box" />
  <text x="570" y="185" class="text">Events → refetch</text>
  <text x="570" y="205" class="text">Re-render loop</text>

  <rect x="710" y="160" width="200" height="80" class="box" />
  <text x="730" y="185" class="text">Editor closes</text>
  <text x="730" y="205" class="text">Hash invalid</text>

  <text x="80" y="300" class="text">Hash behavior:</text>
  <text x="80" y="320" class="text muted">- Session-scoped</text>
  <text x="80" y="340" class="text muted">- Can rotate</text>
  <text x="80" y="360" class="text muted">- Never persisted</text>
</svg>
