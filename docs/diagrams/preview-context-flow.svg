<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Preview context flow through BFF">
  <defs>
    <style>
      .title { font: 600 20px/1.2 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .label { font: 600 14px/1.2 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .text  { font: 12.5px/1.3 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .box   { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 10; }
      .arrow { stroke: #111827; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#111827" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff" />
  <text x="40" y="36" class="title">Preview Context Flow (BFF / Middleware)</text>

  <rect x="60" y="160" width="240" height="90" class="box" />
  <text x="180" y="200" text-anchor="middle" class="label">Frontend</text>
  <text x="80" y="225" class="text">Hash in URL</text>

  <rect x="360" y="160" width="240" height="90" class="box" />
  <text x="480" y="200" text-anchor="middle" class="label">BFF / Middleware</text>
  <text x="380" y="225" class="text">Preserve hash</text>

  <rect x="660" y="160" width="240" height="90" class="box" />
  <text x="780" y="200" text-anchor="middle" class="label">Contentstack</text>
  <text x="680" y="225" class="text">Preview or delivery</text>

  <line x1="300" y1="205" x2="360" y2="205" class="arrow" marker-end="url(#arrow)" />
  <line x1="600" y1="205" x2="660" y2="205" class="arrow" marker-end="url(#arrow)" />

  <text x="60" y="320" class="text">Rule: Decide preview vs delivery where data is fetched.</text>
  <text x="60" y="342" class="text">If hash is present, bypass caches and databases.</text>
</svg>
