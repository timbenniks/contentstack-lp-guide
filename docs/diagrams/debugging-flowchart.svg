<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Live Preview debugging flowchart">
  <defs>
    <style>
      .title { font: 600 20px/1.2 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .label { font: 600 13px/1.2 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .box   { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 10; }
      .arrow { stroke: #111827; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#111827" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff" />
  <text x="40" y="36" class="title">Debugging Live Preview: Pipeline Checks</text>

  <rect x="120" y="100" width="240" height="60" class="box" />
  <text x="240" y="135" text-anchor="middle" class="label">Hash in URL?</text>

  <rect x="120" y="200" width="240" height="60" class="box" />
  <text x="240" y="235" text-anchor="middle" class="label">SDK initialized?</text>

  <rect x="120" y="300" width="240" height="60" class="box" />
  <text x="240" y="335" text-anchor="middle" class="label">Events firing?</text>

  <rect x="520" y="100" width="240" height="60" class="box" />
  <text x="640" y="135" text-anchor="middle" class="label">Preview API?</text>

  <rect x="520" y="200" width="240" height="60" class="box" />
  <text x="640" y="235" text-anchor="middle" class="label">Caching disabled?</text>

  <rect x="520" y="300" width="240" height="60" class="box" />
  <text x="640" y="335" text-anchor="middle" class="label">UI re-render?</text>

  <line x1="240" y1="160" x2="240" y2="200" class="arrow" marker-end="url(#arrow)" />
  <line x1="240" y1="260" x2="240" y2="300" class="arrow" marker-end="url(#arrow)" />
  <line x1="360" y1="130" x2="520" y2="130" class="arrow" marker-end="url(#arrow)" />
  <line x1="640" y1="160" x2="640" y2="200" class="arrow" marker-end="url(#arrow)" />
  <line x1="640" y1="260" x2="640" y2="300" class="arrow" marker-end="url(#arrow)" />
</svg>
