<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Live Preview sequence: CMS, Website, Preview Services">
  <defs>
    <style>
      .title { font: 600 20px/1.2 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .label { font: 600 14px/1.2 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .text  { font: 13px/1.3 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .muted { fill: #6b7280; }
      .lane  { stroke: #e5e7eb; stroke-width: 2; }
      .dash  { stroke-dasharray: 6 6; }
      .box   { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 10; }
      .arrow { stroke: #111827; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#111827" />
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#ffffff" />

  <text x="40" y="36" class="title">Live Preview: Three-Lane Sequence</text>

  <!-- Header boxes -->
  <rect x="60" y="60" width="240" height="44" class="box" />
  <rect x="360" y="60" width="240" height="44" class="box" />
  <rect x="660" y="60" width="240" height="44" class="box" />

  <text x="180" y="88" text-anchor="middle" class="label">Contentstack CMS</text>
  <text x="480" y="88" text-anchor="middle" class="label">Website</text>
  <text x="780" y="88" text-anchor="middle" class="label">Preview Services</text>

  <!-- Lanes -->
  <line x1="180" y1="110" x2="180" y2="520" class="lane dash" />
  <line x1="480" y1="110" x2="480" y2="520" class="lane dash" />
  <line x1="780" y1="110" x2="780" y2="520" class="lane dash" />

  <!-- Step 1 -->
  <text x="40" y="150" class="text">1. CMS creates session + hash</text>
  <line x1="200" y1="160" x2="460" y2="160" class="arrow" marker-end="url(#arrow)" />
  <text x="330" y="148" text-anchor="middle" class="text muted">Loads site with hash</text>

  <!-- Step 2 -->
  <text x="40" y="210" class="text">2. Site initializes SDK</text>
  <circle cx="480" cy="212" r="5" fill="#111827" />
  <text x="500" y="216" class="text muted">Handshake ready</text>

  <!-- Step 3 -->
  <text x="40" y="270" class="text">3. CMS signals change event</text>
  <line x1="200" y1="280" x2="460" y2="280" class="arrow" marker-end="url(#arrow)" />
  <text x="330" y="268" text-anchor="middle" class="text muted">postMessage</text>

  <!-- Step 4 -->
  <text x="40" y="330" class="text">4. Site refetches draft data</text>
  <line x1="500" y1="340" x2="760" y2="340" class="arrow" marker-end="url(#arrow)" />
  <text x="630" y="328" text-anchor="middle" class="text muted">Preview API request</text>

  <!-- Step 5 -->
  <text x="40" y="390" class="text">5. Preview services return draft</text>
  <line x1="760" y1="400" x2="500" y2="400" class="arrow" marker-end="url(#arrow)" />
  <text x="630" y="388" text-anchor="middle" class="text muted">Draft response</text>

  <!-- Step 6 -->
  <text x="40" y="450" class="text">6. Site re-renders</text>
  <circle cx="480" cy="452" r="5" fill="#111827" />
  <text x="500" y="456" class="text muted">Updated preview</text>
</svg>
