<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Preview API vs Delivery API">
  <defs>
    <style>
      .title { font: 600 20px/1.2 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .label { font: 600 14px/1.2 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .text  { font: 12.5px/1.3 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .muted { fill: #6b7280; }
      .box   { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 10; }
      .arrow { stroke: #111827; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#111827" />
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#ffffff" />
  <text x="40" y="36" class="title">Preview API vs Delivery API</text>

  <rect x="80" y="100" width="360" height="260" class="box" />
  <text x="260" y="130" text-anchor="middle" class="label">Preview API</text>
  <text x="100" y="160" class="text">Content: Draft + unpublished</text>
  <text x="100" y="182" class="text">Auth: Preview token + hash</text>
  <text x="100" y="204" class="text">Caching: Never</text>
  <text x="100" y="226" class="text">Scope: Session-scoped</text>

  <rect x="520" y="100" width="360" height="260" class="box" />
  <text x="700" y="130" text-anchor="middle" class="label">Delivery API</text>
  <text x="540" y="160" class="text">Content: Published</text>
  <text x="540" y="182" class="text">Auth: Delivery token</text>
  <text x="540" y="204" class="text">Caching: Safe</text>
  <text x="540" y="226" class="text">Scope: Global</text>

  <text x="80" y="420" class="label">Decision rule</text>
  <text x="80" y="445" class="text">If live preview hash is present → use Preview API</text>
  <text x="80" y="465" class="text">If hash is absent → use Delivery API</text>

  <line x1="350" y1="420" x2="610" y2="420" class="arrow" marker-end="url(#arrow)" />
  <text x="480" y="408" text-anchor="middle" class="text muted">Switch point</text>
</svg>
