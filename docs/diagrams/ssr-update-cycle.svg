<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="SSR live preview update cycle">
  <defs>
    <style>
      .title { font: 600 20px/1.2 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .label { font: 600 14px/1.2 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .text  { font: 12.5px/1.3 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .box   { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 10; }
      .arrow { stroke: #111827; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#111827" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff" />
  <text x="40" y="36" class="title">SSR Preview Update Cycle</text>

  <rect x="80" y="100" width="300" height="70" class="box" />
  <text x="230" y="140" text-anchor="middle" class="label">Editor changes content</text>

  <rect x="520" y="100" width="300" height="70" class="box" />
  <text x="670" y="140" text-anchor="middle" class="label">SDK signals reload</text>

  <rect x="80" y="230" width="300" height="70" class="box" />
  <text x="230" y="270" text-anchor="middle" class="label">Iframe reloads</text>

  <rect x="520" y="230" width="300" height="70" class="box" />
  <text x="670" y="270" text-anchor="middle" class="label">Server request</text>

  <rect x="80" y="360" width="300" height="70" class="box" />
  <text x="230" y="400" text-anchor="middle" class="label">Fetch draft data</text>

  <rect x="520" y="360" width="300" height="70" class="box" />
  <text x="670" y="400" text-anchor="middle" class="label">Render HTML</text>

  <line x1="380" y1="135" x2="520" y2="135" class="arrow" marker-end="url(#arrow)" />
  <line x1="670" y1="170" x2="670" y2="230" class="arrow" marker-end="url(#arrow)" />
  <line x1="380" y1="265" x2="520" y2="265" class="arrow" marker-end="url(#arrow)" />
  <line x1="670" y1="300" x2="670" y2="360" class="arrow" marker-end="url(#arrow)" />
  <line x1="380" y1="395" x2="520" y2="395" class="arrow" marker-end="url(#arrow)" />
</svg>
