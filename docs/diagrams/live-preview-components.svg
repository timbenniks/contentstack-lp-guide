<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Live Preview architecture components">
  <defs>
    <style>
      .title { font: 600 20px/1.2 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .label { font: 600 14px/1.2 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .text  { font: 12.5px/1.3 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .muted { fill: #6b7280; }
      .box   { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 10; }
      .arrow { stroke: #111827; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#111827" />
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#ffffff" />
  <text x="40" y="36" class="title">Live Preview Components and Boundaries</text>

  <!-- Core components -->
  <rect x="60" y="80" width="260" height="120" class="box" />
  <text x="190" y="105" text-anchor="middle" class="label">Contentstack CMS</text>
  <text x="80" y="130" class="text">- Entry editor</text>
  <text x="80" y="148" class="text">- Session + hash</text>
  <text x="80" y="166" class="text">- Change events</text>

  <rect x="350" y="80" width="260" height="120" class="box" />
  <text x="480" y="105" text-anchor="middle" class="label">Live Preview SDK</text>
  <text x="370" y="130" class="text">- Handshake</text>
  <text x="370" y="148" class="text">- Event bridge</text>
  <text x="370" y="166" class="text">- Hash updates</text>

  <rect x="640" y="80" width="260" height="120" class="box" />
  <text x="770" y="105" text-anchor="middle" class="label">Your Website</text>
  <text x="660" y="130" class="text">- Render content</text>
  <text x="660" y="148" class="text">- Refetch on event</text>
  <text x="660" y="166" class="text">- Apply edit tags</text>

  <!-- Data services -->
  <rect x="140" y="300" width="280" height="120" class="box" />
  <text x="280" y="325" text-anchor="middle" class="label">Preview Services</text>
  <text x="160" y="350" class="text">Draft content</text>
  <text x="160" y="368" class="text">Requires preview token + hash</text>
  <text x="160" y="386" class="text muted">No caching</text>

  <rect x="540" y="300" width="280" height="120" class="box" />
  <text x="680" y="325" text-anchor="middle" class="label">Delivery Services</text>
  <text x="560" y="350" class="text">Published content</text>
  <text x="560" y="368" class="text">Delivery token</text>
  <text x="560" y="386" class="text muted">Cacheable</text>

  <!-- Arrows -->
  <line x1="320" y1="140" x2="350" y2="140" class="arrow" marker-end="url(#arrow)" />
  <text x="335" y="128" text-anchor="middle" class="text muted">postMessage</text>

  <line x1="610" y1="140" x2="640" y2="140" class="arrow" marker-end="url(#arrow)" />
  <text x="625" y="128" text-anchor="middle" class="text muted">API</text>

  <line x1="700" y1="200" x2="700" y2="300" class="arrow" marker-end="url(#arrow)" />
  <text x="712" y="260" class="text muted">Fetch (preview or delivery)</text>

  <line x1="480" y1="200" x2="280" y2="300" class="arrow" marker-end="url(#arrow)" />
  <text x="390" y="250" class="text muted">Preview context</text>

  <line x1="480" y1="200" x2="680" y2="300" class="arrow" marker-end="url(#arrow)" />
  <text x="580" y="250" class="text muted">Production context</text>
</svg>
