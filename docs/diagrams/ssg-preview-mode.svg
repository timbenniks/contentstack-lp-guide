<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="SSG preview mode vs production">
  <defs>
    <style>
      .title { font: 600 20px/1.2 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .label { font: 600 14px/1.2 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .text  { font: 12.5px/1.3 "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .box   { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 10; }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff" />
  <text x="40" y="36" class="title">SSG: Production vs Preview Mode</text>

  <rect x="80" y="90" width="360" height="380" class="box" />
  <text x="260" y="120" text-anchor="middle" class="label">Production (SSG)</text>
  <text x="100" y="160" class="text">Build time fetch</text>
  <text x="100" y="182" class="text">Static HTML</text>
  <text x="100" y="204" class="text">CDN cached</text>
  <text x="100" y="226" class="text">No draft content</text>

  <rect x="520" y="90" width="360" height="380" class="box" />
  <text x="700" y="120" text-anchor="middle" class="label">Preview Mode</text>
  <text x="540" y="160" class="text">Static files bypassed</text>
  <text x="540" y="182" class="text">Dynamic render (SSR)</text>
  <text x="540" y="204" class="text">Preview API + hash</text>
  <text x="540" y="226" class="text">No caching</text>
</svg>
